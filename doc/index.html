<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>uQRCode 中文文档</title>
  </head>
  <body>
    <script>
      var replaces = ['uqrcode.cn', 'doc.uqrcode.cn'];
      var redirect = 'uqrcode.cn/doc';
      var current = location.host;
      if (replaces.includes(current)) {
        var url = location.href.replace(current, redirect);
        location.replace(url);
      }
    </script>
  </body>
</html>
